{% extends "accounts/base.html" %}
{% block content %}
<section class="form-panel form-panel-narrow error-page">
    <p class="eyebrow">ERROR {% block code %}{% endblock %}</p>
    <h1>{% block heading %}{% endblock %}</h1>
    <p class="muted">{% block message %}{% endblock %}</p>
    <div class="form-actions">
        {% if user.is_authenticated %}
            <a class="button button-primary" href="{% url 'accounts:dashboard' %}">Go to my dashboard</a>
            <a class="button button-secondary" href="{% url 'allowances:list' %}">Allowances</a>
        {% else %}
            <a class="button button-primary" href="{% url 'accounts:login' %}">Log in</a>
        {% endif %}
    </div>
</section>
{% endblock %}
